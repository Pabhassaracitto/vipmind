name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# The repo had no CI at all before this file: no analyze, no test, no build.
# This job is deliberately small — it only fails when the Dart code is broken,
# so it can be trusted from day one. Platform builds (APK/IPA) are a separate
# step once an Android keystore and an iOS GoogleService-Info.plist exist.
#
# Analyze/test output is mirrored into the Step Summary on purpose: the raw job
# log lives on a blob host that is awkward to reach from tooling, while
# `GET /repos/{owner}/{repo}/actions/runs/{id}` returns the summary as HTML.

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep the SDK explicit so a Flutter release cannot silently break
          # main. The code uses Color.withValues(alpha:) → needs >= 3.27.
          flutter-version: 3.35.0
          cache: true

      - name: Record toolchain in summary
        run: |
          {
            echo "## Toolchain"
            echo '```'
            flutter --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: flutter pub get

      # GitHub cannot turn `flutter analyze` output into annotations, and the
      # raw job log lives on a blob host that tooling frequently cannot reach.
      # So every finding is re-emitted as `::error/warning file=...,line=...`,
      # readable from GET /check-runs/{id}/annotations. Both analyzer formats are
      # handled ("level • msg • path:line:col • rule" and "[rule] level • ..."),
      # and the FULL output goes into the Step Summary — an earlier version read
      # only the tail, which hid findings and made a red run unfixable.
      - name: Analyze (blocking)
        run: |
          set +e
          flutter analyze --no-pub 2>&1 | tee analyze.txt
          code=${PIPESTATUS[0]}
          ANALYZE_EXIT=$code python3 - <<'PYEOF'
          import os, re, collections

          code = os.environ.get('ANALYZE_EXIT', '0')
          text = open('analyze.txt', encoding='utf-8', errors='replace').read()
          lines = [l.strip() for l in text.split('\n') if l.strip()]

          B = '\u2022'
          def esc(t):
              return (t.replace('%', '%25').replace('\r', ' ').replace('\n', ' ')
                       .replace(':', '%3A').replace(',', '%2C'))

          trailing_rule = re.compile(
              r'^(?P<level>error|warning|info)\s*' + B + r'\s*(?P<msg>.*?)\s*' + B +
              r'\s*(?P<path>.+?):(?P<line>\d+):(?P<col>\d+)\s*' + B + r'\s*(?P<rule>[\w.-]+)$')
          bracket_rule = re.compile(
              r'^\[(?P<rule>[\w.-]+)\]\s+(?P<level>error|warning|info)\s*' + B +
              r'\s*(?P<msg>.*?)\s*' + B + r'\s*(?P<path>.+?):(?P<line>\d+):(?P<col>\d+)$')

          counts = collections.Counter()
          parsed = 0
          for line in lines:
              m = trailing_rule.match(line) or bracket_rule.match(line)
              if not m:
                  continue
              parsed += 1
              level = m.group('level')
              counts[level] += 1
              counts[m.group('rule')] += 1
              # GitHub annotation levels are error/warning/notice.
              gh = {'error': 'error', 'warning': 'warning', 'info': 'notice'}[level]
              print(f"::{gh} file={m.group('path')},line={m.group('line')},"
                    f"col={m.group('col')}::{esc(m.group('rule') + ': ' + m.group('msg'))}")

          print(f'::notice::flutter analyze exit={code}, findings parsed={parsed}, '
                f"errors={counts['error']}, warnings={counts['warning']}, infos={counts['info']}")

          if code != '0' and parsed == 0:
              print('::error::analyze failed but no finding was parsed; raw tail below')
              for line in lines[-60:]:
                  print(f'::error::{esc(line[:400])}')
          PYEOF
          {
            echo "## flutter analyze (exit $code)"
            echo '```'
            cat analyze.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # `--reporter github` makes flutter_test emit `::error title=...
      # file=...,line=...` workflow commands itself, so failures are attributed
      # to the right file instead of to the workflow. The full output is also
      # posted as a PR comment by the next step, because the check-run
      # annotations API caps failure annotations at 10 and the raw job log lives
      # on a blob host that tooling often cannot reach.
      - name: Test (blocking)
        run: |
          set +e
          flutter test --no-pub --reporter github 2>&1 | tee test.txt
          code=${PIPESTATUS[0]}
          {
            echo "## flutter test (exit $code)"
            echo '```'
            cat test.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Report results on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          marker="<!-- vipmind-ci-report -->"
          {
            echo "$marker"
            echo "### CI report — commit ${GITHUB_SHA:0:7}"
            echo
            if [ -f analyze.txt ]; then
              echo "#### flutter analyze"
              echo '```'
              tail -n 120 analyze.txt
              echo '```'
            fi
            if [ -f test.txt ]; then
              passed=$(grep -c "^✅" test.txt || true)
              failed=$(grep -c "^❌" test.txt || true)
              echo "#### flutter test — $passed passed, $failed failed"
              echo '```'
              # A failure with the github reporter is "❌ path: name (failed)"
              # followed by its exception block, so keep 24 lines after each
              # marker. No `tail` cap: a cap is what hid 13 of 15 failures here.
              grep -A 24 "^❌" test.txt | head -n 1400
              echo '```'
              echo '```'
            fi
          } > ci-report.md
          if [ -n "$PR_NUMBER" ]; then
            existing=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate --jq ".[] | select(.body | startswith("$marker")) | .id" | head -1)
            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$existing" -F body=@ci-report.md >/dev/null \
                || gh pr comment "$PR_NUMBER" --body-file ci-report.md
            else
              gh pr comment "$PR_NUMBER" --body-file ci-report.md
            fi
          fi

      # Informational: run `dart format .` locally before pushing. This step
      # does not fail the build yet — the codebase predates any formatting
      # enforcement, and a red first run teaches nobody anything. Flip it to
      # blocking once `dart format .` has been applied (card IN4-131).
      - name: Formatting check (informational)
        continue-on-error: true
        run: |
          set +e
          dart format --output=none --set-exit-if-changed lib test 2>&1 | tee format.txt
          code=${PIPESTATUS[0]}
          {
            echo "## dart format --set-exit-if-changed (exit $code)"
            echo '```'
            tail -n 100 format.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # Raw output as an artifact: annotations are capped at 10 in the API
      # response, and the job log lives on a blob host that tooling often cannot
      # reach. An artifact is the reliable way to read a full failure list.
      - name: Upload analyzer and test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-test-output
          path: |
            analyze.txt
            test.txt
            format.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Check the template catalog is valid JSON
        run: python3 -c "import json;json.load(open('assets/templates/default_templates.json'));print('default_templates.json OK')"

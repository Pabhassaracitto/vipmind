name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The repo had no CI at all before this file: no analyze, no test, no build.
# This job is deliberately small — it only fails when the Dart code is broken,
# so it can be trusted from day one. Platform builds (APK/IPA) are a separate
# step once an Android keystore and an iOS GoogleService-Info.plist exist.
#
# Analyze/test output is mirrored into the Step Summary on purpose: the raw job
# log lives on a blob host that is awkward to reach from tooling, while
# `GET /repos/{owner}/{repo}/actions/runs/{id}` returns the summary as HTML.

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep the SDK explicit so a Flutter release cannot silently break
          # main. The code uses Color.withValues(alpha:) → needs >= 3.27.
          flutter-version: 3.35.0
          cache: true

      - name: Record toolchain in summary
        run: |
          {
            echo "## Toolchain"
            echo '```'
            flutter --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: flutter pub get

      # The analyzer output format changed between Flutter releases
      # (3.35 prints "[rule] error \u2022 message \u2022 path:line:col"), and GitHub
      # cannot turn any of it into annotations by itself. The raw job log lives
      # on a blob host that tooling frequently cannot reach, so findings are
      # re-emitted here as `::error file=...,line=...` (readable from
      # GET /check-runs/{id}/annotations). Any severity line the parser does not
      # recognise is still emitted as a title-less annotation, so the output can
      # never disappear silently.
      - name: Analyze (blocking)
        run: |
          set +e
          flutter analyze --no-pub 2>&1 | tee analyze.txt
          code=${PIPESTATUS[0]}
          ANALYZE_EXIT=$code python3 - <<'PYEOF'
          import os, re

          code = os.environ.get('ANALYZE_EXIT', '0')
          lines = open('analyze.txt', encoding='utf-8', errors='replace').read().split('\n')

          bullet = '\u2022'
          parsed = 0
          recognised = re.compile(
              r'\[(?P<rule>[\w.-]+)\]\s+'
              r'(?P<level>error|warning|info)\s*' + bullet + r'\s*'
              r'(?P<msg>.*?)\s*' + bullet + r'\s*'
              r'(?P<path>.+?):(?P<line>\d+):(?P<col>\d+)\s*$'
          )
          loose = re.compile(
              r'\b(?P<level>error|warning|info)\s*' + bullet + r'\s*'
              r'(?P<msg>.*?)\s*' + bullet + r'\s*'
              r'(?P<path>.+?):(?P<line>\d+):(?P<col>\d+)\s*$'
          )

          def esc(text):
              return (text.replace('%', '%25').replace('\r', ' ')
                          .replace('\n', ' ').replace(':', '%3A').replace(',', '%2C'))

          for raw in lines:
              line = raw.strip()
              if not line:
                  continue
              m = recognised.search(line) or loose.search(line)
              if m:
                  parsed += 1
                  level = m.group('level')
                  rule = m.groupdict().get('rule') or ''
                  msg = f"{rule}: {m.group('msg')}" if rule else m.group('msg')
                  print(f"::{level} file={m.group('path')},line={m.group('line')},"
                        f"col={m.group('col')}::{esc(msg)}")
              elif re.search(r'\b(error|warning|info)\b', line) and bullet in line:
                  parsed += 1
                  print(f'::error::{esc(line[:400])}')

          # Safety net: if the parse found nothing but analyze failed, dump the
          # tail so the failure is never opaque.
          if code != '0' and parsed == 0:
              print('::error::analyze failed but no severity line was parsed; raw tail below')
              for raw in lines[-60:]:
                  if raw.strip():
                      print(f'::error::{esc(raw.strip()[:400])}')
          PYEOF
          {
            echo "## flutter analyze (exit $code)"
            echo '```'
            tail -n 200 analyze.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Test (blocking)
        run: |
          set +e
          flutter test --no-pub --reporter expanded 2>&1 | tee test.txt
          code=${PIPESTATUS[0]}
          TEST_EXIT=$code python3 - <<'PYEOF'
          import os, re

          code = os.environ.get('TEST_EXIT', '0')
          lines = open('test.txt', encoding='utf-8', errors='replace').read().split('\n')

          def esc(text):
              return (text.replace('%', '%25').replace('\r', ' ')
                          .replace('\n', ' ').replace(':', '%3A').replace(',', '%2C'))

          interesting = re.compile(
              r'\[E\]|Some tests failed|Failed to load|Expected:|Actual:|'
              r'Which:|^\s*\d+:\d+\s+|Test failed|Exception|Error:'
          )
          hits = [l.strip() for l in lines if l.strip() and interesting.search(l)]
          for line in hits[:200]:
              print(f'::error::{esc(line[:400])}')
          if code != '0' and not hits:
              print('::error::flutter test failed but no known pattern matched; raw tail below')
              for raw in lines[-80:]:
                  if raw.strip():
                      print(f'::error::{esc(raw.strip()[:400])}')
          PYEOF
          {
            echo "## flutter test (exit $code)"
            echo '```'
            tail -n 200 test.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # Informational: run `dart format .` locally before pushing. This step
      # does not fail the build yet — the codebase predates any formatting
      # enforcement, and a red first run teaches nobody anything. Flip it to
      # blocking once `dart format .` has been applied (card IN4-131).
      - name: Formatting check (informational)
        continue-on-error: true
        run: |
          set +e
          dart format --output=none --set-exit-if-changed lib test 2>&1 | tee format.txt
          code=${PIPESTATUS[0]}
          {
            echo "## dart format --set-exit-if-changed (exit $code)"
            echo '```'
            tail -n 100 format.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Check the template catalog is valid JSON
        run: python3 -c "import json;json.load(open('assets/templates/default_templates.json'));print('default_templates.json OK')"

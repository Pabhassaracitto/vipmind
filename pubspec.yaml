name: neuromindmap
description: "NeuroMindmap - Your Brain, Amplified. A cognitive amplification platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_analytics: ^10.8.0

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9

  # UI/UX
  flutter_svg: ^2.0.9
  lottie: ^3.0.0
  shimmer: ^3.0.0
  animate_do: ^3.1.2
  flutter_staggered_animations: ^1.1.1
  glassmorphism: ^3.0.0
  flutter_colorpicker: ^1.0.3
  google_fonts: ^6.1.0

  # Canvas & Graphics
  flutter_painter_v2: ^2.0.0
  perfect_freehand: ^2.0.0
  vector_math: ^2.1.4

  # Audio
  just_audio: ^0.9.36
  #record: ^5.0.4
  audio_waveforms: ^1.0.5

  # AI & Processing
  http: ^1.1.2
  dio: ^5.4.0
  flutter_tts: ^3.8.5
  speech_to_text: ^7.0.0
  image_picker: ^1.0.7
  # google_ml_kit: ^0.16.3

  # Storage & Data
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  #file_picker: ^6.1.1

  # Export
  pdf: ^3.10.7
  printing: ^5.11.1
  share_plus: ^7.2.1
  screenshot: ^2.1.0

  # Utils
  uuid: ^4.3.3
  intl: ^0.18.1
  url_launcher: ^6.2.4
  permission_handler: ^11.2.0
  connectivity_plus: ^5.0.2
  vibration: ^3.1.5

  # Icons
  cupertino_icons: ^1.0.6
  flutter_iconpicker: ^3.2.4
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8


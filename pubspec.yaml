name: vipmind
description: "VipMind - Your Brain, Amplified. Mindmap editor with Firebase sync."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (Auth + Firestore) — the only backend the app currently talks to.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # State management — ChangeNotifier + Provider (see docs/AGENT_NOTES.md).
  provider: ^6.1.2

  # UI/UX
  animate_do: ^3.3.4
  flutter_colorpicker: ^1.1.0

  # Audio (node/interaction sound effects, ambient loops)
  just_audio: ^0.9.40

  # Local settings persistence
  shared_preferences: ^2.3.2

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# NOTE: every package below was declared before but never imported anywhere in
# lib/. They were removed on purpose (each one is extra build/native risk).
# Add a package back in the same commit that actually uses it:
#   firebase_storage, firebase_analytics, flutter_riverpod, flutter_svg, lottie,
#   shimmer, flutter_staggered_animations, glassmorphism, google_fonts,
#   flutter_painter_v2, perfect_freehand, vector_math, audio_waveforms, http,
#   dio, flutter_tts, speech_to_text, image_picker, hive, hive_flutter,
#   path_provider, pdf, printing, share_plus, screenshot, url_launcher,
#   permission_handler, connectivity_plus, vibration, flutter_iconpicker, iconsax

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/templates/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_Bold.ttf
          weight: 700

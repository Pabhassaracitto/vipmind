name: neuromindmap
description: "NeuroMindmap - Your Brain, Amplified. A cognitive amplification platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  firebase_analytics: ^12.1.2

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^3.2.1

  # UI/UX
  flutter_svg: ^2.0.9
  lottie: ^3.0.0
  shimmer: ^3.0.0
  animate_do: ^4.2.0
  flutter_staggered_animations: ^1.1.1
  glassmorphism: ^3.0.0
  flutter_colorpicker: ^1.0.3
  google_fonts: ^8.0.1

  # Canvas & Graphics
  flutter_painter_v2: ^2.0.0
  perfect_freehand: ^2.0.0
  vector_math: ^2.1.4

  # Audio
  just_audio: ^0.10.5
  #record: ^5.0.4
  audio_waveforms: ^2.0.2

  # AI & Processing
  http: ^1.1.2
  dio: ^5.4.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.3.0
  image_picker: ^1.0.7
  # google_ml_kit: ^0.16.3

  # Storage & Data
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  #file_picker: ^6.1.1

  # Export
  pdf: ^3.10.7
  printing: ^5.11.1
  share_plus: ^12.0.1
  screenshot: ^3.0.0

  # Utils
  uuid: ^4.3.3
  intl: ^0.20.2
  url_launcher: ^6.2.4
  permission_handler: ^12.0.1
  connectivity_plus: ^7.0.0
  vibration: ^3.1.6

  # Icons
  cupertino_icons: ^1.0.6
  flutter_iconpicker: ^4.0.3
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    # - assets/images/icons/
    - assets/audio/
    - assets/templates/

